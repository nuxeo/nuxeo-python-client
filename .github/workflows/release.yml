name: Release
permissions:
  contents: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch, tag or SHA to release from"
        required: true
        default: "master"

jobs:
  resolve-release-ref:
    name: Resolve release ref
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release-ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Resolve release commit
        id: release-ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pure-built-distribution:
    name: Build pure wheel
    needs: resolve-release-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.1 # Maximum supported version
      - run: python -m pip install -U pip setuptools wheel
      - run: python setup.py bdist_wheel
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-wheel
          path: ./dist/*.whl

  source-distribution:
    name: Build source distribution
    needs: resolve-release-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.1 # Maximum supported version
      - run: python -m pip install -U pip setuptools
      - run: python setup.py sdist
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-source
          path: dist

  publish:
    needs:
      - pure-built-distribution
      - source-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true
      - run: ls -l dist

      - name: Upload Python Client on PyPi API Packages
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          PYPI_API_REPO_URL: ${{ github.ref == 'refs/heads/master' && 'public' || 'private' }}
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

  publish-github-tag:
    name: Publish GitHub tag
    needs:
      - publish
      - resolve-release-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release-ref.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.1 # Keep aligned with build jobs

      - name: Fetch current version
        id: package-version
        run: echo "version=$(python -c 'from nuxeo import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Create and publish GitHub tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          tag="release-${VERSION}"
          target_sha=$(git rev-parse HEAD)

          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_sha=$(git rev-list -n 1 "$tag")
            if [[ "$tag_sha" != "$target_sha" ]]; then
              echo "::error::Tag ${tag} already points to ${tag_sha}, expected ${target_sha}."
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists."
          else
            gh release create "$tag" --verify-tag --generate-notes --title "$tag"
          fi
