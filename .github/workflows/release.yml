name: Release
permissions:
  contents: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch, tag or SHA to release from"
        required: true
        default: "master"

jobs:
  pure-built-distribution:
    name: Build pure wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.1 # Maximum supported version
      - run: python -m pip install -U pip setuptools wheel
      - run: python setup.py bdist_wheel
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-wheel
          path: ./dist/*.whl

  source-distribution:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.1 # Maximum supported version
      - run: python -m pip install -U pip setuptools
      - run: python setup.py sdist
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-source
          path: dist

  publish:
    needs:
      - pure-built-distribution
      - source-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true
      - run: ls -l dist

      - name: Upload Python Client on PyPi API Packages
        uses: pypa/gh-action-pypi-publish@release/v1
        env:
          PYPI_API_REPO_URL: ${{ github.ref == 'refs/heads/master' && 'public' || 'private' }}
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true

  publish-github-tag:
    name: Publish GitHub tag
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Fetch current version
        id: package-version
        run: echo "version=$(python -c 'from nuxeo import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Create and publish GitHub tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          tag="release-${VERSION}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --generate-notes --title "$tag"
